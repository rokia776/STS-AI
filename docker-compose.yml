services:
  llm-qa:
    build: .
    image: llm-qa:1.0
    container_name: llm-qa
    ports:
      - "8000:8000"
    environment:
      - FLAN_MODEL=google/flan-t5-small
      - FLAN_MAX_NEW_TOKENS=256
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/llm_qa
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./logs:/app/logs
      - hf_cache:/app/hf_cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=llm_qa
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d llm_qa"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hf_cache:
  postgres_data:
  redis_data:
