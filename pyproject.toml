[project]
name = "llm-qa"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "asyncpg",
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "redis",
    "transformers",
    "sentencepiece",
    "torch",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
